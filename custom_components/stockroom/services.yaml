link_item:
  name: Link item
  description: >
    Links a Home Assistant device to an existing Stockroom item and writes a
    deep link back into Stockroom.
  fields:
    entity_id:
      name: Entity
      description: >
        Any entity whose device should be linked. The device is resolved from
        this entity.
      required: true
      selector:
        entity:
    item_id:
      name: Stockroom item ID
      description: Numeric ID of the Stockroom item to link to.
      required: true
      example: 42
      selector:
        number:
          min: 1
          mode: box
    friendly_name:
      name: Friendly name
      description: >
        Optional name to store on the Stockroom link. Defaults to the device
        name.
      required: false
      selector:
        text:

unlink_item:
  name: Unlink item
  description: >
    Removes the link between a Home Assistant device and its Stockroom item.
  fields:
    entity_id:
      name: Entity
      description: Any entity whose device is currently linked.
      required: true
      selector:
        entity:

create_and_link_item:
  name: Create and link item
  description: >
    Creates a new Stockroom item for an unmatched Home Assistant device and
    links it.
  fields:
    entity_id:
      name: Entity
      description: Any entity whose device should get a new Stockroom item.
      required: true
      selector:
        entity:
    name:
      name: Name
      description: Name for the new Stockroom item. Defaults to the device name.
      required: false
      selector:
        text:
    type:
      name: Type
      description: Stockroom item type to create.
      required: false
      default: item
      selector:
        select:
          options:
            - room
            - container
            - item
    parent_id:
      name: Parent ID
      description: Optional Stockroom parent (room or container) ID.
      required: false
      selector:
        number:
          min: 1
          mode: box

search:
  name: Search
  description: >
    Searches Stockroom for items and returns the top hits with their location
    path.
  fields:
    query:
      name: Query
      description: Text to search for (for example, "where is the drill?").
      required: true
      example: drill
      selector:
        text:

list_maintenance_tasks:
  name: List maintenance tasks
  description: >
    Returns the maintenance schedules on a Stockroom item. Identify the item by
    a linked device or by its Stockroom item ID.
  fields:
    device_id:
      name: Device
      description: >
        A Home Assistant device linked to the Stockroom item. Provide this or the
        item ID.
      required: false
      selector:
        device:
          filter:
            - integration: stockroom
    item_id:
      name: Stockroom item ID
      description: Numeric ID of the Stockroom item. Provide this or a device.
      required: false
      example: 42
      selector:
        number:
          min: 1
          mode: box

create_maintenance_task:
  name: Create maintenance task
  description: >
    Creates a maintenance reminder on a Stockroom item — a repeating interval or
    a one-off due date.
  fields:
    device_id:
      name: Device
      description: >
        A Home Assistant device linked to the Stockroom item. Provide this or the
        item ID.
      required: false
      selector:
        device:
          filter:
            - integration: stockroom
    item_id:
      name: Stockroom item ID
      description: Numeric ID of the Stockroom item. Provide this or a device.
      required: false
      example: 42
      selector:
        number:
          min: 1
          mode: box
    title:
      name: Title
      description: Name of the maintenance task (for example, "Descale").
      required: true
      example: Descale
      selector:
        text:
    schedule_type:
      name: Schedule type
      description: >
        A repeating interval (re-bases after each completion), or a one-off
        single due date that archives itself once done.
      required: false
      default: interval
      selector:
        select:
          translation_key: maintenance_schedule_type
          options:
            - interval
            - one_off
    interval_value:
      name: Interval value
      description: How many units between occurrences (required for interval tasks).
      required: false
      example: 3
      selector:
        number:
          min: 1
          max: 999
          mode: box
    interval_unit:
      name: Interval unit
      description: Unit of the interval (required for interval tasks).
      required: false
      selector:
        select:
          translation_key: maintenance_interval_unit
          options:
            - days
            - weeks
            - months
            - years
    next_due_at:
      name: Next due date
      description: First due date (required for one-off tasks).
      required: false
      selector:
        date:
    description:
      name: Description
      description: Optional notes about the task.
      required: false
      selector:
        text:
          multiline: true
    reminder_lead_days:
      name: Reminder lead days
      description: How many days before the due date the task starts needing attention.
      required: false
      default: 7
      selector:
        number:
          min: 0
          max: 365
          mode: box

complete_maintenance_task:
  name: Complete maintenance task
  description: >
    Marks a maintenance task done, recording a history entry and rolling its
    schedule forward. Use the task ID from "List maintenance tasks".
  fields:
    task_id:
      name: Task ID
      description: Numeric ID of the maintenance task to complete.
      required: true
      example: 7
      selector:
        number:
          min: 1
          mode: box
    completed_at:
      name: Completed on
      description: When the task was done (defaults to today; cannot be in the future).
      required: false
      selector:
        date:
    notes:
      name: Notes
      description: Optional notes recorded with the completion.
      required: false
      selector:
        text:
          multiline: true
    cost:
      name: Cost
      description: Optional cost of the maintenance.
      required: false
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
