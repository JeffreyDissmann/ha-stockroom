[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "PL",
  "RUF",
  "SIM",
]
ignore = [
  "PLR2004",
  "PLR0913",
  "PLR0915",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.stockroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
